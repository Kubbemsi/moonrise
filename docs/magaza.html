    <style>
        /* NAVBAR (ÜST MENÜ) STİLLERİ */
header {
    width: 100%;
    max-width: 1300px;
    margin: 0 auto 30px auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(35, 17, 8, 0.85);
    border: 2px solid #ca8a04;
    border-radius: 18px;
    padding: 15px 25px;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}

.logo-box {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, #fef08a 0%, #facc15 100%);
    color: #422006;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
}

nav ul {
    display: flex;
    list-style: none;
    gap: 20px;
    margin: 0;
    padding: 0;
}

nav ul li a {
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 10px;
    transition: all 0.2s;
}

nav ul li a:hover, nav ul li a.active {
    background: #facc15;
    color: #422006;
}

.user-btn {
    width: 45px;
    height: 45px;
    border: 2px solid #ca8a04;
    border-radius: 12px;
    color: #facc15;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    font-size: 18px;
    transition: all 0.2s;
}

.user-btn:hover {
    background: #ca8a04;
    color: #fff;
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            /* Sıcak Künefe Arka Planı */
            background: radial-gradient(circle at top center, #2e1205 0%, #170802 60%, #0d0401 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 30px;
        }

        /* Üst Başlık */
        .page-header {
            max-width: 1300px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #facc15;
            text-shadow: 0 2px 10px rgba(250, 204, 21, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: linear-gradient(135deg, #15803d 0%, #166534 100%);
            color: #fff;
            padding: 12px 22px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 0 #14532d, 0 5px 15px rgba(22, 101, 52, 0.4);
            transition: all 0.2s;
            border: 1px solid #22c55e;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #14532d, 0 8px 20px rgba(22, 101, 52, 0.6);
        }

        /* Ana Düzen */
        .shop-container {
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 25px;
        }

        /* Sol Panel */
        .sidebar-card {
            background: rgba(35, 17, 8, 0.85);
            border: 2px solid #ca8a04;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .sidebar-logo {
            background: linear-gradient(135deg, #fef08a 0%, #facc15 100%);
            color: #422006;
            width: 70px;
            height: 70px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            box-shadow: 0 5px 0 #b45309;
        }

        .category-title {
            width: 100%;
            font-size: 12px;
            color: #fde047;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .category-item {
            width: 100%;
            background: linear-gradient(135deg, #166534 0%, #14532d 100%);
            padding: 14px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            border: 1.5px solid #22c55e;
            box-shadow: 0 4px 0 #0f391b;
        }

        /* VIP Ürün Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        /* Ürün Kartı */
        .product-card {
            background: linear-gradient(180deg, rgba(42, 20, 10, 0.9) 0%, rgba(25, 11, 5, 0.95) 100%);
            border: 2px solid #ca8a04;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: #facc15;
            box-shadow: 0 12px 25px rgba(250, 204, 21, 0.25);
        }

        .product-body {
            padding: 25px 15px 15px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* VIP İkon Kutuları */
        .vip-img-box {
            width: 110px;
            height: 110px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 18px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }

        .vip-title {
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 12px;
            text-transform: uppercase;
            color: #fef08a;
            letter-spacing: 0.5px;
        }

        /* Fiyat Alanı */
        .current-price {
            font-size: 24px;
            font-weight: 900;
            color: #22c55e;
            text-shadow: 0 2px 8px rgba(34, 197, 94, 0.3);
            margin-bottom: 15px;
        }

        /* Satın Al Butonu (Kadayıf Sarısı) */
        .buy-btn {
            background: linear-gradient(180deg, #fef08a 0%, #facc15 100%);
            color: #422006;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 13px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 0 #b45309;
            margin: 0 15px 18px 15px;
            transition: all 0.1s;
        }

        .buy-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b45309;
        }
    </style>
</head>
