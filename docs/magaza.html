<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KünefeSMP | Mağaza</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; user-select: none; }
        body { background-color: #0d0401; color: #ffffff; min-height: 100vh; overflow-x: hidden; }
        .hero-section { position: relative; width: 100%; min-height: 100vh; background: radial-gradient(circle at center, #3d1708 0%, #1c0a03 60%, #0d0401 100%); display: flex; flex-direction: column; align-items: center; padding: 0 20px 40px 20px; }
        .hero-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(rgba(202, 138, 4, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(202, 138, 4, 0.05) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
        
        header { width: 100%; max-width: 1300px; margin: 40px auto 30px auto; display: flex; justify-content: space-between; align-items: center; background: rgba(35, 17, 8, 0.85); border: 2px solid #ca8a04; border-radius: 18px; padding: 15px 25px; backdrop-filter: blur(8px); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); z-index: 10; }
        .logo-box { width: 50px; height: 50px; background: linear-gradient(135deg, #fef08a 0%, #facc15 100%); color: #422006; border-radius: 12px; display: flex; justify-content: center; align-items: center; text-decoration: none; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); transition: transform 0.2s ease; }
        .logo-box:hover { transform: scale(1.05); }
        nav ul { display: flex; gap: 15px; list-style: none; }
        nav ul li a { color: #ffffff; text-decoration: none; font-weight: 800; font-size: 14px; padding: 10px 20px; border-radius: 10px; transition: all 0.2s ease; display: flex; align-items: center; gap: 8px; }
        nav ul li a.active, nav ul li a:hover { background: #facc15; color: #422006; }
        nav ul li a.active svg, nav ul li a:hover svg { fill: #422006; }
        .user-btn { width: 50px; height: 50px; border: 2px solid #ca8a04; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: #facc15; text-decoration: none; transition: all 0.2s ease; }
        .user-btn:hover { background: rgba(202, 138, 4, 0.2); }

        .store-container { width: 100%; max-width: 1300px; display: flex; gap: 20px; z-index: 10; margin-top: 20px; }
        .sidebar { width: 250px; display: flex; flex-direction: column; gap: 20px; }
        .sidebar-box { background: rgba(35, 17, 8, 0.85); border: 2px solid #ca8a04; border-radius: 18px; padding: 20px; }
        .sidebar-title { font-size: 12px; color: #facc15; font-weight: 900; margin-bottom: 12px; text-transform: uppercase; }
        .cat-btn { background: #15803d; color: #fff; padding: 12px; border-radius: 10px; font-weight: 800; text-align: center; cursor: pointer; border: 1px solid #22c55e; }

        .products-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .product-card { background: rgba(35, 17, 8, 0.85); border: 2px solid #ca8a04; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
        .badge { width: 100px; height: 100px; border-radius: 16px; display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 18px; color: #1c0a03; }
        .vip { background: linear-gradient(135deg, #fef08a, #facc15); }
        .megavip { background: linear-gradient(135deg, #86efac, #22c55e); }
        .ultravip { background: linear-gradient(135deg, #d8b4fe, #a855f7); }
        .kunefevip { background: linear-gradient(135deg, #fef08a, #eab308); }
        .sponsor { background: linear-gradient(135deg, #f472b6, #ec4899); }

        .p-title { font-size: 15px; font-weight: 900; }
        .p-price { font-size: 20px; font-weight: 900; color: #22c55e; }
        
        /* Satın Al Buton / Link Tarafı */
        .buy-btn { 
            background: linear-gradient(135deg, #fef08a, #facc15); 
            color: #422006; 
            border: none; 
            padding: 10px 0; 
            width: 100%; 
            border-radius: 10px; 
            font-weight: 900; 
            cursor: pointer; 
            text-decoration: none; 
            display: block;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .buy-btn:hover {
            transform: scale(1.03);
            filter: brightness(1.05);
        }
    </style>
</head>
