<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KünefeSMP | Minecraft Sunucusu</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- PC KULLANICISI GELIRSE PC SİTESİNE GERİ YÖNLENDİR -->
    <script>
        if (window.innerWidth > 768 && !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            window.location.href = "index.html";
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0401;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: radial-gradient(circle at center, #3d1708 0%, #1c0a03 60%, #0d0401 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 16px 30px 16px;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(202, 138, 4, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(202, 138, 4, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        /* HEADER */
        header {
            width: 100%;
            margin: 20px auto 24px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(35, 17, 8, 0.85);
            border: 2px solid #ca8a04;
            border-radius: 16px;
            padding: 12px 16px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #fef08a 0%, #facc15 100%);
            color: #422006;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* MOBİL NAV - Scroll edilebilir yatay */
        nav {
            flex: 1;
            overflow-x: auto;
            margin: 0 10px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        nav::-webkit-scrollbar { display: none; }

        nav ul {
            display: flex;
            gap: 6px;
            list-style: none;
            white-space: nowrap;
        }

        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 800;
            font-size: 11px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        nav ul li a.active, nav ul li a:hover {
            background: #facc15;
            color: #422006;
        }

        .user-btn {
            width: 42px;
            height: 42px;
            border: 2px solid #ca8a04;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #facc15;
            text-decoration: none;
            flex-shrink: 0;
        }

        /* ANA İÇERİK */
        .main-content {
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 10px 0 24px 0;
            flex: 1;
            justify-content: center;
        }

        .version-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(35, 17, 8, 0.9);
            border: 1.5px solid #ca8a04;
            color: #fef08a;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.8px;
        }

        .mascot-img-center {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            object-fit: contain;
            image-rendering: pixelated;
            border: 3px solid #ca8a04;
            background: rgba(35,17,8,0.9);
            padding: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            animation: gentleFloat 4s ease-in-out infinite;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .server-title {
            font-size: 42px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 25px rgba(250, 204, 21, 0.45);
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .server-subtitle {
            font-size: 10px;
            font-weight: 800;
            color: #fef08a;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .feature-pills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .pill {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(202,138,4,0.35);
            padding: 5px 11px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 800;
            color: #d1d5db;
        }

        /* YouTube Butonu */
        .youtube-btn {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            border: 2px solid #ef4444;
            padding: 12px 24px;
            border-radius: 14px;
            color: #ffffff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(220,38,38,0.35);
            width: 100%;
            max-width: 320px;
        }

        .yt-icon-wrapper {
            width: 34px;
            height: 34px;
            background: rgba(255,255,255,0.15);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .youtube-btn .btn-text { display: flex; flex-direction: column; text-align: left; }
        .youtube-btn .title { font-size: 14px; font-weight: 900; }
        .youtube-btn .sub { font-size: 10px; opacity: 0.85; font-weight: 700; }

        /* ALT KARTLAR */
        .bottom-cards {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .card-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            border-radius: 16px;
            text-decoration: none;
            cursor: pointer;
            width: 100%;
        }

        .ip-card {
            background: linear-gradient(135deg, #fef08a 0%, #facc15 100%);
            color: #422006;
            box-shadow: 0 8px 20px rgba(250,204,21,0.25);
            border: 2px solid rgba(202,138,4,0.4);
        }

        .discord-card {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(34,197,94,0.25);
            border: 2px solid rgba(34,197,94,0.4);
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .ip-card .card-icon { background: rgba(66,32,6,0.15); }
        .discord-card .card-icon { background: rgba(0,0,0,0.15); }

        .card-text { display: flex; flex-direction: column; gap: 2px; }
        .card-text .main-text { font-size: 14px; font-weight: 900; }
        .card-text .sub-text { font-size: 11px; font-weight: 800; opacity: 0.9; }

        .sub-row { display: flex; align-items: center; gap: 6px; }

        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background-color: #ca8a04;
            display: inline-block;
        }
        .status-dot.online {
            background-color: #16a34a;
            box-shadow: 0 0 7px #16a34a;
            animation: pulseGreen 1.8s infinite;
        }
        .status-dot.offline { background-color: #dc2626; }

        @keyframes pulseGreen {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22,163,74,0.7); }
            70% { transform: scale(1.15); box-shadow: 0 0 0 6px rgba(22,163,74,0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22,163,74,0); }
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #facc15;
            color: #422006;
            padding: 12px 22px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 13px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 100;
            white-space: nowrap;
        }
    </style>
</head>

            </a>
        </header>

        <!-- ANA İÇERİK -->
        <main class="main-content">

    <!-- TOAST -->

        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        <span>IP Adresi Kopyalandı!</span>
    </div>

    <script>
        function copyIP(ip) {
            navigator.clipboard.writeText(ip).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'inline-flex';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            });
        }

        async function fetchPlayerCount() {
            const subText = document.getElementById('player-count-text');
            const statusDot = document.getElementById('server-status-dot');
            try {
                const response = await fetch('https://api.mcsrvstat.us/2/oyna.kunefesmp.com.tr');
                const data = await response.json();
                if (data.online) {
                    const online = data.players ? data.players.online : 0;
                    const max = data.players ? data.players.max : 0;
                    subText.innerText = `${online} / ${max} oyuncu aktif`;
                    statusDot.className = 'status-dot online';
                } else {
                    subText.innerText = 'Sunucu şu an çevrimdışı';
                    statusDot.className = 'status-dot offline';
                }
            } catch(e) {
                subText.innerText = 'Durum alınamadı';
                statusDot.className = 'status-dot offline';
            }
        }

        fetchPlayerCount();
    </script>
