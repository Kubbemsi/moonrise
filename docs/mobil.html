<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KünefeSMP | Mobil</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <!-- PC KULLANICISI BİLGİSAYARDAN AÇARSA PC SİTESİNE GERİ YÖNLENDİR -->
    <script>
        if (window.innerWidth > 768 && !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            window.location.href = "index.html";
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d0401;
            color: #ffffff;
            min-height: 100vh;
        }

        .mobile-container {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: radial-gradient(circle at center, #3d1708 0%, #1c0a03 60%, #0d0401 100%);
            min-height: 100vh;
        }

        /* --- MOBİL HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(35, 17, 8, 0.9);
            border: 2px solid #ca8a04;
            border-radius: 14px;
            padding: 12px 16px;
            position: relative;
            z-index: 20;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #fef08a 0%, #facc15 100%);
            color: #422006;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .menu-toggle {
            background: transparent;
            border: none;
            color: #facc15;
            cursor: pointer;
        }

        /* --- MOBİL AÇILIR MENÜ --- */
        nav {
            display: none;
            position: absolute;
            top: 70px;
            left: 0;
            right: 0;
            background: rgba(25, 10, 4, 0.98);
            border: 2px solid #ca8a04;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        }

        nav.open {
            display: block;
        }

        nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
        }

        nav ul li a.active {
            background: #facc15;
            color: #422006;
        }

        /* --- DİKEY İÇERİK --- */
        .hero-content {
            text-align: center;
            margin: 20px 0;
        }

        .server-title {
            font-size: 38px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
        }

        .server-subtitle {
            font-size: 13px;
            font-weight: 800;
            color: #fef08a;
            margin-top: 6px;
            margin-bottom: 20px;
        }

        .youtube-btn {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            border: 2px solid #ef4444;
            padding: 14px;
            border-radius: 12px;
            color: #ffffff;
            text-decoration: none;
            display: block;
            width: 100%;
        }

        .youtube-btn .title {
            font-size: 16px;
            font-weight: 900;
            display: block;
        }

        .youtube-btn .sub {
            font-size: 11px;
            opacity: 0.8;
            display: block;
            margin-top: 2px;
        }

        /* --- DİKEY KARTLAR --- */
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }

        .card-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            width: 100%;
        }

        .ip-card {
            background: linear-gradient(135deg, #fef08a 0%, #facc15 100%);
            color: #422006;
        }

        .discord-card {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: #ffffff;
        }

        .card-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .ip-card .card-icon { background: rgba(66, 32, 6, 0.15); }
        .discord-card .card-icon { background: rgba(0, 0, 0, 0.15); }

        .card-text .main-text {
            font-size: 15px;
            font-weight: 900;
            display: block;
        }

        .card-text .sub-text {
            font-size: 11px;
            font-weight: 700;
            opacity: 0.85;
            display: block;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #facc15;
            color: #422006;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            display: none;
            z-index: 100;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <header>
            <a href="mobil.html" class="logo-box">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
            </a>

            <!-- AÇILIR MENÜ BUTONU -->
            <button class="menu-toggle" onclick="toggleMenu()">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>

            <nav id="mobileNav">
                <ul>
                    <li><a href="mobil.html" class="active">ANASAYFA</a></li>
                    <li><a href="magaza-mobil.html">MAĞAZA</a></li>
                    <li><a href="yardim-mobil.html ">YARDIM</a></li>
                    <li><a href="destek-mobil.html">DESTEK</a></li>
                    <li><a href="cezalar-mobil.html">CEZALAR</a></li>
                </ul>
            </nav>
        </header>

        <div class="hero-content">
            <h1 class="server-title">KÜNEFESMP</h1>
            <p class="server-subtitle">BİLDİĞİN DÜMDÜZ SMP SUNUCUSU İŞTE</p>
            
            <a href="https://youtube.com/@unplugmc" target="_blank" class="youtube-btn">
                <span class="title">UnplugMC YouTube</span>
                <span class="sub">Videoları ve yayınları kaçırma!</span>
            </a>
        </div>

        <div class="cards-list">
            <div class="card-btn ip-card" onclick="copyIP('oyna.kunefesmp.com.tr')">
                <div class="card-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                </div>
                <div class="card-text">
                    <span class="main-text">OYNA.KUNEFESMP.COM.TR</span>
                    <span class="sub-text">Tıkla ve IP Adresini Kopyala</span>
                </div>
            </div>

            <a href="https://discord.gg/Mj6QMcNQ2" target="_blank" class="card-btn discord-card">
                <div class="card-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                </div>
                <div class="card-text">
                    <span class="main-text">DISCORD</span>
                    <span class="sub-text">Topluluğumuza Katıl</span>
                </div>
            </a>
        </div>
    </div>

    <div id="toast" class="toast">IP Adresi Kopyalandı!</div>

    <script>
        function toggleMenu() {
            document.getElementById('mobileNav').classList.toggle('open');
        }

        function copyIP(ip) {
            navigator.clipboard.writeText(ip).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            });
        }
    </script>
</body>
</html>
