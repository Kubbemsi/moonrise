<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KünefeSMP | Mağaza (Mobil)</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <!-- PC KULLANICISI GELİRSE PC SİTESİNE GERİ YÖNLENDİR -->
    <script>
        if (window.innerWidth > 768 && !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            window.location.href = "magaza.html";
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; user-select: none; }
        body { background-color: #0d0401; color: #ffffff; min-height: 100vh; }
        
        .mobile-container {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: radial-gradient(circle at center, #3d1708 0%, #1c0a03 60%, #0d0401 100%);
            min-height: 100vh;
        }

        /* --- MOBİL HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(35, 17, 8, 0.9);
            border: 2px solid #ca8a04;
            border-radius: 14px;
            padding: 12px 16px;
            position: relative;
            z-index: 20;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #fef08a 0%, #facc15 100%);
            color: #422006;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .menu-toggle {
            background: transparent;
            border: none;
            color: #facc15;
            cursor: pointer;
        }

        /* --- MOBİL AÇILIR MENÜ --- */
        nav {
            display: none;
            position: absolute;
            top: 70px;
            left: 0;
            right: 0;
            background: rgba(25, 10, 4, 0.98);
            border: 2px solid #ca8a04;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        }

        nav.open { display: block; }

        nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
        }

        nav ul li a.active {
            background: #facc15;
            color: #422006;
        }

        /* --- KATEGORİ ALANI --- */
        .category-box {
            background: rgba(35, 17, 8, 0.85);
            border: 2px solid #ca8a04;
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-title {
            font-size: 12px;
            color: #facc15;
            font-weight: 900;
            text-transform: uppercase;
        }

        .cat-btn {
            background: #15803d;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12px;
            border: 1px solid #22c55e;
        }

        /* --- ÜRÜN KARTLARI --- */
        .products-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .product-card {
            background: rgba(35, 17, 8, 0.85);
            border: 2px solid #ca8a04;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge {
            width: 75px;
            height: 75px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 13px;
            color: #1c0a03;
            flex-shrink: 0;
            text-align: center;
        }

        .vip { background: linear-gradient(135deg, #fef08a, #facc15); }
        .megavip { background: linear-gradient(135deg, #86efac, #22c55e); }
        .ultravip { background: linear-gradient(135deg, #d8b4fe, #a855f7); }
        .kunefevip { background: linear-gradient(135deg, #fef08a, #eab308); }
        .sponsor { background: linear-gradient(135deg, #f472b6, #ec4899); }

        .product-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .p-title { font-size: 14px; font-weight: 900; }
        .p-price { font-size: 17px; font-weight: 900; color: #22c55e; }

        .buy-btn {
            background: linear-gradient(135deg, #fef08a, #facc15);
            color: #422006;
            text-decoration: none;
            padding: 8px 0;
            text-align: center;
            border-radius: 8px;
            font-weight: 900;
            font-size: 13px;
            display: block;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- HEADER -->
        <header>
            <a href="mobile.html" class="logo-box">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
            </a>

            <button class="menu-toggle" onclick="toggleMenu()">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>

            <nav id="mobileNav">
                <ul>
                    <li><a href="mobil.html">ANASAYFA</a></li>
                    <li><a href="magaza-mobil.html" class="active">MAĞAZA</a></li>
                    <li><a href="yardim-mobil.html">YARDIM</a></li>
                    <li><a href="destek-mobil.html">DESTEK</a></li>
                    <li><a href="cezalar-mobil.html">CEZALAR</a></li>
                </ul>
            </nav>
        </header>

        <!-- KATEGORİ -->
        <div class="category-box">
            <span class="category-title">Kategori</span>
            <div class="cat-btn">Survival</div>
        </div>

        <!-- ÜRÜN LİSTESİ -->
        <div class="products-list">
            <div class="product-card">
                <div class="badge vip">VIP</div>
                <div class="product-info">
                    <div class="p-title">VIP - 30 GÜN</div>
                    <div class="p-price">25.00 ₺</div>
                    <a href="vip.html" class="buy-btn">SATIN AL</a>
                </div>
            </div>

            <div class="product-card">
                <div class="badge megavip">MEGAVIP</div>
                <div class="product-info">
                    <div class="p-title">MEGAVIP - 30 GÜN</div>
                    <div class="p-price">100.00 ₺</div>
                    <a href="megavip.html" class="buy-btn">SATIN AL</a>
                </div>
            </div>

            <div class="product-card">
                <div class="badge ultravip">ULTRAVIP</div>
                <div class="product-info">
                    <div class="p-title">ULTRAVIP - 30 GÜN</div>
                    <div class="p-price">200.00 ₺</div>
                    <a href="ultravip.html" class="buy-btn">SATIN AL</a>
                </div>
            </div>

            <div class="product-card">
                <div class="badge kunefevip">KÜNEFEVIP</div>
                <div class="product-info">
                    <div class="p-title">KUNEFEVIP - 30 GÜN</div>
                    <div class="p-price">300.00 ₺</div>
                    <a href="kunefevip.html" class="buy-btn">SATIN AL</a>
                </div>
            </div>

            <div class="product-card">
                <div class="badge sponsor">SPONSOR</div>
                <div class="product-info">
                    <div class="p-title">SPONSOR - SÜRESİZ</div>
                    <div class="p-price">1,000.00 ₺</div>
                    <a href="sponsor.html" class="buy-btn">SATIN AL</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('mobileNav').classList.toggle('open');
        }
    </script>
</body>
</html>
