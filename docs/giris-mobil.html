<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KünefeSMP | Hesabım (Mobil)</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

    <!-- PC KULLANICISI GELİRSE PC SİTESİNE GERİ YÖNLENDİR -->
    <script>
        if (window.innerWidth > 768 && !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            window.location.href = "giris.html";
        }
    </script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Montserrat',sans-serif; user-select:none; }
        body { background-color:#0d0401; color:#ffffff; min-height:100vh; }

        .mobile-container {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: radial-gradient(circle at center, #3d1708 0%, #1c0a03 60%, #0d0401 100%);
            min-height: 100vh;
        }

        /* --- MOBİL HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(35, 17, 8, 0.9);
            border: 2px solid #ca8a04;
            border-radius: 14px;
            padding: 12px 16px;
            position: relative;
            z-index: 20;
        }

        .logo-box {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #fef08a 0%, #facc15 100%);
            color: #422006;
            border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            text-decoration: none;
        }

        .menu-toggle { background:transparent; border:none; color:#facc15; cursor:pointer; }

        nav {
            display: none;
            position: absolute;
            top: 70px; left: 0; right: 0;
            background: rgba(25, 10, 4, 0.98);
            border: 2px solid #ca8a04;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        nav.open { display: block; }
        nav ul { list-style:none; display:flex; flex-direction:column; gap:10px; }
        nav ul li a {
            color: #ffffff; text-decoration:none; font-weight:800; font-size:15px;
            padding: 12px; border-radius:8px; display:flex; align-items:center; gap:12px;
            background: rgba(255,255,255,0.05);
        }
        nav ul li a.active { background:#facc15; color:#422006; }

        /* --- AUTH KARTI --- */
        .auth-card {
            background: rgba(35, 17, 8, 0.85);
            border: 2px solid #ca8a04;
            border-radius: 16px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Sekme Butonları */
        .tab-buttons {
            display: flex;
            gap: 8px;
            background: rgba(13, 4, 1, 0.5);
            padding: 5px;
            border-radius: 10px;
            border: 1px solid rgba(202, 138, 4, 0.3);
        }

        .tab-btn {
            flex: 1;
            padding: 11px 0;
            border: none;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            background: transparent;
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #fef08a, #facc15);
            color: #422006;
            box-shadow: 0 4px 12px rgba(250, 204, 21, 0.2);
        }

        /* Form */
        .auth-form { display:flex; flex-direction:column; gap:14px; margin-top:4px; }

        .form-group { display:flex; flex-direction:column; gap:6px; }

        .form-group label { font-size:12px; font-weight:800; color:#facc15; }

        .form-group input {
            background: rgba(13, 4, 1, 0.7);
            border: 1.5px solid rgba(202, 138, 4, 0.4);
            border-radius: 10px;
            padding: 13px 14px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            transition: border-color 0.2s ease;
            width: 100%;
        }

        .form-group input:focus { border-color: #facc15; }
        .form-group input::placeholder { color:#6b7280; font-weight:600; }

        .submit-btn {
            background: linear-gradient(135deg, #fef08a, #facc15);
            color: #422006;
            border: none;
            padding: 14px 0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 4px;
            box-shadow: 0 4px 15px rgba(250, 204, 21, 0.2);
            width: 100%;
        }

        /* Profil */
        .profile-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
            padding: 10px 0;
        }

        .profile-avatar {
            width: 90px; height: 90px;
            border-radius: 16px;
            border: 3px solid #facc15;
            background: #1c0a03;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.3);
            image-rendering: pixelated;
        }

        .profile-info h2 { font-size:22px; font-weight:900; color:#facc15; }
        .profile-info p { font-size:12px; color:#d1d5db; font-weight:700; margin-top:4px; }

        .logout-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            border: none;
            padding: 13px 0;
            width: 100%;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
        }

        .hidden { display:none !important; }

        .error-msg {
            color: #f87171;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="mobile-container">

        <!-- HEADER -->
        <header>
            <a href="mobile.html" class="logo-box">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
            </a>
            <button class="menu-toggle" onclick="toggleMenu()">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <nav id="mobileNav">
                <ul>
                    <li><a href="mobil.html">ANASAYFA</a></li>
                    <li><a href="magaza-mobil.html">MAĞAZA</a></li>
                    <li><a href="yardim-mobil.html">YARDIM</a></li>
                    <li><a href="destek-mobil.html">DESTEK</a></li>
                    <li><a href="cezalar-mobil.html">CEZALAR</a></li>
                </ul>
            </nav>
        </header>

        <!-- AUTH KARTI -->
        <div class="auth-card">

            <div id="error-box" class="error-msg"></div>

            <!-- GİRİŞ & KAYIT FORMLARI -->
            <div id="auth-forms-wrapper">
                <div class="tab-buttons">
                    <button class="tab-btn active" id="tab-login-btn">Giriş Yap</button>
                    <button class="tab-btn" id="tab-register-btn">Kayıt Ol</button>
                </div>

                <!-- GİRİŞ YAP FORM -->
                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="login-email">E-posta Adresi</label>
                        <input type="email" id="login-email" placeholder="ornek@kunefesmp.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Şifre</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="submit-btn">Giriş Yap</button>
                </form>

                <!-- KAYIT OL FORM -->
                <form id="register-form" class="auth-form hidden">
                    <div class="form-group">
                        <label for="reg-username">Oyuncu Adı (IGN)</label>
                        <input type="text" id="reg-username" placeholder="Oyuncu adın" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">E-posta Adresi</label>
                        <input type="email" id="reg-email" placeholder="ornek@kunefesmp.com" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Şifre</label>
                        <input type="password" id="reg-password" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password-repeat">Tekrar Şifre</label>
                        <input type="password" id="reg-password-repeat" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="submit-btn">Kayıt Ol</button>
                </form>
            </div>

            <!-- PROFİL EKRANI -->
            <div id="profile-wrapper" class="profile-box hidden">
                <img id="user-avatar" class="profile-avatar" src="" alt="Avatar">
                <div class="profile-info">
                    <h2 id="user-name">Oyuncu</h2>
                    <p id="user-email-text">E-posta</p>
                </div>
                <button id="logout-btn" class="logout-btn">Çıkış Yap</button>
            </div>

        </div>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('mobileNav').classList.toggle('open');
        }
    </script>

    <!-- FIREBASE KÜTÜPHANELERİ VE BAĞLANTI -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged,
            updateProfile 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCDI7kmxlLRKpcRLp9J-HNYyq4wFBIia1w",
            authDomain: "kunefesmp.firebaseapp.com",
            projectId: "kunefesmp",
            storageBucket: "kunefesmp.firebasestorage.app",
            messagingSenderId: "394720158469",
            appId: "1:394720158469:web:f933b340d23c3846f5cd6c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const authFormsWrapper = document.getElementById('auth-forms-wrapper');
        const profileWrapper = document.getElementById('profile-wrapper');
        const errorBox = document.getElementById('error-box');
        const tabLoginBtn = document.getElementById('tab-login-btn');
        const tabRegisterBtn = document.getElementById('tab-register-btn');
        const logoutBtn = document.getElementById('logout-btn');

        tabLoginBtn.addEventListener('click', () => switchTab('login'));
        tabRegisterBtn.addEventListener('click', () => switchTab('register'));

        function switchTab(tab) {
            showError('');
            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLoginBtn.classList.add('active');
                tabRegisterBtn.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabLoginBtn.classList.remove('active');
                tabRegisterBtn.classList.add('active');
            }
        }

        function showError(msg) {
            if (msg) { errorBox.innerText = msg; errorBox.style.display = 'block'; }
            else { errorBox.style.display = 'none'; }
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showError('');
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const passwordRepeat = document.getElementById('reg-password-repeat').value;

            if (password !== passwordRepeat) { showError("Şifreler birbiriyle eşleşmiyor!"); return; }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                await updateProfile(user, { displayName: username });
                await setDoc(doc(db, "users", user.uid), {
                    username: username, email: email, createdAt: new Date().toISOString()
                });
                localStorage.setItem('kunefeUser', username);
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') showError('Bu e-posta adresi zaten kullanımda.');
                else if (error.code === 'auth/weak-password') showError('Şifre en az 6 karakter olmalıdır.');
                else showError('Kayıt oluşturulurken bir hata oluştu: ' + error.message);
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showError('');
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    showError('E-posta veya şifre hatalı!');
                } else { showError('Giriş yapılırken bir hata oluştu.'); }
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            localStorage.removeItem('kunefeUser');
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                authFormsWrapper.classList.add('hidden');
                profileWrapper.classList.remove('hidden');
                let username = user.displayName;
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) username = userDoc.data().username || username;
                } catch (e) { console.error("Kullanıcı verisi çekilemedi:", e); }
                const displayName = username || 'Oyuncu';
                localStorage.setItem('kunefeUser', displayName);
                document.getElementById('user-name').innerText = displayName;
                document.getElementById('user-email-text').innerText = user.email;
                document.getElementById('user-avatar').src = `https://mc-heads.net/avatar/${displayName}/100`;
            } else {
                authFormsWrapper.classList.remove('hidden');
                profileWrapper.classList.add('hidden');
                localStorage.removeItem('kunefeUser');
            }
        });
    </script>
</body>
</html>
