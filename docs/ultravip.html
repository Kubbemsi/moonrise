            gap: 16px;
        }

            width: 100%;
            height: 140px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;

            font-weight: 900;

<body>

                    <div class="banner-title" id="banner-title">ULTRAVIP</div>
                    <div class="banner-tag" id="banner-tag">30 GÜNLÜK ÜYELİK</div>
                </div>

                <div class="features-header">PAKET AYRICALIKLARI</div>

                <div class="features-list" id="features-list">
                    <!-- JavaScript Dinamik Basar -->
                </div>
            </div>

            <!-- SAĞ SATIN ALMA KUTUSU -->
            <div class="checkout-card">
                <div>
                    <div class="product-title" id="product-title">UltraVIP Paket</div>
                    <div class="price-text">Toplam Tutar: <span id="total-price">200.00 ₺</span></div>
                </div>

                <div>
                    <div class="form-label">GİRİŞ YAPILAN HESAP</div>
                    <div class="user-box">
                        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        <span id="logged-username">asd</span>
                    </div>
                </div>

                <div>
                    <div class="form-label">PAKET ADEDİ</div>
                    <div class="quantity-control">
                        <button class="qty-btn" onclick="updateQuantity(-1)">-</button>
                        <input type="text" id="qty-count" class="qty-input" value="1" readonly>
                        <button class="qty-btn" onclick="updateQuantity(1)">+</button>
                    </div>
                </div>

                <button class="add-cart-btn" onclick="addToCart()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                    SEPETE EKLE
                </button>
            </div>
        </div>
    </div>

    <script>
        const vipData = {
            VIP: {
                pageTitle: "VIP ÜYELİK",
                name: "VIP Paket",
                bannerTitle: "VIP",
                bannerBg: "linear-gradient(135deg, #d97706 0%, #b45309 100%)",
                bannerGlow: "0 0 25px rgba(217, 119, 6, 0.3)",
                unitPrice: 50,
                features: [
                    "<b>[VIP]</b> Sohbet Başlığı & Renk",
                    "Özel VIP Kiti Başlangıç Eşyaları",
                    "<b>/fly</b> Uçma Komutu",
                    "Sanal Sandık ( <b>/enderchest</b> )"
                ]
            },
            ULTRAVIP: {
                pageTitle: "ULTRAVIP ÜYELİK",
                name: "UltraVIP Paket",
                bannerTitle: "ULTRAVIP",
                bannerBg: "linear-gradient(135deg, #a855f7 0%, #6b21a8 100%)",
                bannerGlow: "0 0 25px rgba(168, 85, 247, 0.4)",
                unitPrice: 200,
                features: [
                    "<b>[UltraVIP]</b> Özel Mor Sohbet Başlığı & Rengi",
                    "Full Donanımlı UltraVIP Kiti",
                    "Tüm Dünyalarda <b>/fly</b> Uçuş Hakkı",
                    "Sanal Tamir ( <b>/repair</b> ) Komutu",
                    "Anında TPA (Işınlanma Bekleme Süresi Yok)"
                ]
            }
        };

        let currentVipKey = 'ULTRAVIP'; 
        let quantity = 1;

        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('kunefeUser');
            const userDisplay = document.getElementById('logged-username');
            
            if (savedUser && savedUser.trim() !== '') {
                userDisplay.innerText = savedUser;
            }

            renderVipPage(currentVipKey);
        });

        function renderVipPage(key) {
            const data = vipData[key];
            if (!data) return;

            document.getElementById('bar-title').innerText = data.pageTitle;
            document.getElementById('banner-title').innerText = data.bannerTitle;
            document.getElementById('vip-banner').style.background = data.bannerBg;
            document.getElementById('vip-banner').style.boxShadow = data.bannerGlow;
            document.getElementById('product-title').innerText = data.name;

            const listContainer = document.getElementById('features-list');
            listContainer.innerHTML = data.features.map(item => `
                <div class="feature-item">
                    <span class="check">✓</span>
                    <span>${item}</span>
                </div>
            `).join('');

            calculatePrice();
        }

        function updateQuantity(change) {
            quantity += change;
            if (quantity < 1) quantity = 1;
            document.getElementById('qty-count').value = quantity;
            calculatePrice();
        }

        function calculatePrice() {
            const unitPrice = vipData[currentVipKey].unitPrice;
            const total = unitPrice * quantity;
            document.getElementById('total-price').innerText = `${total.toFixed(2)} ₺`;
        }

        function addToCart() {
    const user = document.getElementById('logged-username').innerText;
    
    // Sepete eklenecek ürün nesnesi
    const cartItem = {
        id: currentVipKey,
        title: vipData[currentVipKey].name,
        price: vipData[currentVipKey].unitPrice,
        quantity: quantity,
        user: user,
        totalPrice: vipData[currentVipKey].unitPrice * quantity
    };

    // Tarayıcının hafızasındaki (localStorage) mevcut sepeti al
    let cart = JSON.parse(localStorage.getItem('kunefeCart')) || [];

    // Aynı ürün daha önce eklenmiş mi kontrol et
    const existingIndex = cart.findIndex(item => item.id === cartItem.id);

    if (existingIndex > -1) {
        // Zaten varsa adetini ve toplam fiyatını güncelle
        cart[existingIndex].quantity += quantity;
        cart[existingIndex].totalPrice = cart[existingIndex].quantity * cart[existingIndex].price;
    } else {
        // Yoksa sepete yeni ürün olarak ekle
        cart.push(cartItem);
    }

    // Güncellenmiş sepeti hafızaya kaydet
    localStorage.getItem('kunefeCart') ? localStorage.setItem('kunefeCart', JSON.stringify(cart)) : localStorage.setItem('kunefeCart', JSON.stringify([cartItem]));

    // Doğrudan Sepet Sayfasına Yönlendir
    window.location.href = "sepet.html"; // Sepet sayfanızın adı neyse onu yazın (örn: sepetim.html)
}
