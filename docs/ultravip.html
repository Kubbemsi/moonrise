<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KünefeSMP | VIP Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        body {
            background: #09070f;
            background-image: 
                radial-gradient(at 10% 10%, rgba(168, 85, 247, 0.12) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(245, 158, 11, 0.12) 0px, transparent 50%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- ÜST BAR --- */
        .navbar {
            background: rgba(22, 18, 36, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-btn:hover { color: #ffffff; }

        .nav-title {
  font-weight: 900;
  letter-spacing: 1px;
  font-size: 16px;
  background: linear-gradient(90deg, #f59e0b, #a855f7);
  background-clip: text; /* Standart özellik */
  -webkit-background-clip: text; /* Safari ve eski Chrome sürümleri için */
  -webkit-text-fill-color: transparent;
}

        .cart-link {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #c084fc;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .cart-link:hover {
            background: #a855f7;
            color: #fff;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        /* --- İÇERİK --- */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) { .card-grid { grid-template-columns: 1fr; } }

        .glass-card {
            background: rgba(18, 14, 29, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .banner {
            background: linear-gradient(135deg, #7e22ce, #3b0764);
            border-radius: 14px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(126, 34, 206, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .banner h1 { font-size: 32px; font-weight: 900; letter-spacing: 2px; }
        .banner span { font-size: 12px; font-weight: 700; opacity: 0.8; letter-spacing: 1px; }

        .feature-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .feature-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #d1d5db;
        }

        .price-badge {
            font-size: 26px;
            font-weight: 900;
            color: #22c55e;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 800;
            color: #a78bfa;
            letter-spacing: 0.5px;
        }

        .user-field {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 800;
            color: #f59e0b;
        }

        .counter {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-cnt {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-cnt:hover { background: #f59e0b; color: #000; }

        .add-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
            margin-top: auto;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(245, 158, 11, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="navbar">
            <a href="magaza.html" class="nav-btn">← Mağaza</a>
            <div class="nav-title">ULTRAVIP PAKETİ</div>
            <button class="cart-link" onclick="location.href='sepet.html'">Sepetim</button>
        </div>

        <div class="card-grid">
            <div class="glass-card">
                <div class="banner">
                    <h1>ULTRAVIP</h1>
                    <span>30 GÜNLÜK AVANTAJ PAKETİ</span>
                </div>
                <div class="feature-list">
                    <div class="feature-item">✓ [UltraVIP] Özel Mor Sohbet Başlığı</div>
                    <div class="feature-item">✓ Full Donanımlı UltraVIP Kiti</div>
                    <div class="feature-item">✓ Tüm Dünyalarda /fly Uçuş Hakkı</div>
                    <div class="feature-item">✓ Sanal Tamir (/repair) Komutu</div>
                </div>
            </div>

            <div class="glass-card">
                <div>
                    <span style="font-size: 12px; font-weight: 700; color: #9ca3af;">PAKET FİYATI</span>
                    <div class="price-badge" id="display-price">200.00 ₺</div>
                </div>

                <div class="input-group">
                    <label>HESAP ADI</label>
                    <div class="user-field" id="user-display">asd</div>
                </div>

                <div class="input-group">
                    <label>ADET</label>
                    <div class="counter">
                        <button class="btn-cnt" onclick="updateQty(-1)">-</button>
                        <span id="qty-val" style="font-weight: 900; font-size: 16px;">1</span>
                        <button class="btn-cnt" onclick="updateQty(1)">+</button>
                    </div>
                </div>

                <button class="add-btn" onclick="addToCart()">SEPETE EKLE</button>
            </div>
        </div>
    </div>

    <script>
        const itemData = {
            id: 'ultravip',
            title: 'UltraVIP Paket',
            unitPrice: 200
        };

        let currentQty = 1;

        document.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('kunefeUser') || 'asd';
            document.getElementById('user-display').innerText = user;
            updatePrice();
        });

        function updateQty(change) {
            currentQty += change;
            if (currentQty < 1) currentQty = 1;
            document.getElementById('qty-val').innerText = currentQty;
            updatePrice();
        }

        function updatePrice() {
            const total = itemData.unitPrice * currentQty;
            document.getElementById('display-price').innerText = total.toFixed(2) + ' ₺';
        }

        function addToCart() {
    const savedUser = localStorage.getItem('kunefeUser');
    
    if (!savedUser || savedUser.trim() === '' || savedUser === 'asd') {
        alert("Sepete ürün ekleyebilmek için lütfen önce giriş yapın!");
        window.location.href = "login.html"; // Giriş sayfanız
        return;
    }

    // ... geri kalan ekleme kodları aynı kalacak
}
            const user = document.getElementById('user-display').innerText;

            const newItem = {
                id: itemData.id,
                title: itemData.title,
                price: itemData.unitPrice,
                quantity: currentQty,
                username: user
            };

            let cart = [];
            try {
                cart = JSON.parse(localStorage.getItem('kunefeCart')) || [];
            } catch(e) { cart = []; }

            const existIndex = cart.findIndex(i => i.id === newItem.id);
            if (existIndex > -1) {
                cart[existIndex].quantity += currentQty;
            } else {
                cart.push(newItem);
            }

            localStorage.setItem('kunefeCart', JSON.stringify(cart));
            window.location.href = 'sepet.html';
        
    </script>
</body>
</html>
