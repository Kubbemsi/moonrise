<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KünefeSMP | VIP Satın Alma</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #0b0200;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- ÜST BAR --- */
        .top-bar {
            width: 100%;
            background: #190a02;
            border: 2px solid #b87b00;
            border-radius: 12px;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: #8b5cf6;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .back-btn:hover { opacity: 0.9; }

        .top-title {
            font-size: 18px;
            font-weight: 900;
            color: #d8b4fe;
        }

        /* --- İÇERİK IZGARASI --- */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        /* --- SOL PAKET KARTI --- */
        .package-card {
            background: #120401;
            border: 2px solid #a855f7;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .vip-icon-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #c084fc, #9333ea);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 13px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            text-align: center;
            padding: 5px;
        }

        .vip-title-box h2 {
            font-size: 20px;
            font-weight: 900;
            color: #d8b4fe;
        }

        .vip-price {
            font-size: 16px;
            font-weight: 800;
            color: #22c55e;
            margin-top: 4px;
        }

        .features-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 13px;
            font-weight: 700;
            color: #e5e7eb;
        }

        .features-list li {
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .features-list strong { color: #ffffff; }

        /* --- SAĞ SATIN ALMA FORMU --- */
        .checkout-card {
            background: #120401;
            border: 2px solid #b87b00;
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .checkout-title {
            font-size: 20px;
            font-weight: 900;
            color: #facc15;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 800;
            color: #facc15;
        }

        .form-group input, .form-group select {
            background: #090200;
            border: 1px solid #b87b00;
            border-radius: 8px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            font-weight: 600;
        }

        .form-group input::placeholder {
            color: #6b7280;
        }

        .pay-btn {
            background: #16a34a;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s, background-color 0.2s;
        }

        .pay-btn:hover {
            background: #22c55e;
            transform: scale(1.01);
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- ÜST BAR -->
        <div class="top-bar">
            <a href="magaza.html" class="back-btn">Mağazaya Dön</a>
            <div class="top-title" id="bar-title">ULTRAVIP Özel Menüsü</div>
        </div>

        <!-- İÇERİK IZGARASI -->
        <div class="content-grid">
            <!-- SOL PAKET DETAYLARI -->
            <div class="package-card" id="vip-card">
                <div class="card-header">
                    <div class="vip-icon-box" id="vip-badge">ULTRAVIP</div>
                    <div class="vip-title-box">
                        <h2 id="vip-name">ULTRAVIP Paket Ayrıcalıkları</h2>
                        <div class="vip-price" id="vip-price">200.00 ₺ / 30 Gün</div>
                    </div>
                </div>

                <ul class="features-list" id="vip-features">
                    <!-- JavaScript dinamik basacak -->
                </ul>
            </div>

            <!-- SAĞ FORM -->
            <div class="checkout-card">
                <div class="checkout-title">Satın Alma İşlemi</div>

                <form id="checkout-form" style="display: flex; flex-direction: column; gap: 15px;">
                    <div class="form-group">
                        <label for="username">Minecraft Kullanıcı Adınız</label>
                        <input type="text" id="username" placeholder="Oyundaki adınızı eksiksiz girin" required>
                    </div>

                    <div class="form-group">
                        <label for="payment-method">Ödeme Yöntemi</label>
                        <select id="payment-method">
                            <option value="shopier">Kredi / Banka Kartı (Shopier/PayTR)</option>
                            <option value="ininal">Papara / Ininal / IBAN</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="email">E-posta Adresiniz (Fiş için)</label>
                        <input type="email" id="email" placeholder="ornek@kunefesmp.com" required>
                    </div>

                    <button type="submit" class="pay-btn" id="pay-btn-text">200.00 ₺ Öde ve Rütbeyi Al</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Tüm VIP ayarlarını tek bir yerden değiştirebilirsin
        const vipConfigs = {
            VIP: {
                title: "VIP Özel Menüsü",
                badgeText: "VIP",
                badgeColor: "linear-gradient(135deg, #eab308, #ca8a04)", // Sarı tonları
                cardBorder: "#eab308",
                glowColor: "rgba(234, 179, 8, 0.2)",
                titleColor: "#fef08a",
                priceText: "50.00 ₺ / 30 Gün",
                btnText: "50.00 ₺ Öde ve Rütbeyi Al",
                features: [
                    "<strong>[VIP]</strong> Özel sarı sohbet başlığı ve rengi",
                    "<strong>VIP Kiti</strong> ile temel büyülü setler",
                    "Fazladan 1 adet <strong>Sethome</strong> hakkı",
                    "Işınlanma bekleme süresi <strong>3 Saniye</strong>"
                ]
            },
            MEGAVIP: {
                title: "MEGAVIP Özel Menüsü",
                badgeText: "MEGAVIP",
                badgeColor: "linear-gradient(135deg, #06b6d4, #0891b2)", // Mavi tonları
                cardBorder: "#06b6d4",
                glowColor: "rgba(6, 182, 212, 0.2)",
                titleColor: "#a5f3fc",
                priceText: "100.00 ₺ / 30 Gün",
                btnText: "100.00 ₺ Öde ve Rütbeyi Al",
                features: [
                    "Tüm <strong>VIP</strong> yetkileri dahildir",
                    "<strong>[MEGAVIP]</strong> Özel mavi sohbet başlığı ve rengi",
                    "<strong>MegaVIP Kiti</strong> ile gelişmiş büyülü setler",
                    "Fazladan 2 adet <strong>Sethome</strong> hakkı",
                    "Sanal Sandık komutu (<strong>/ender</strong>)"
                ]
            },
            ULTRAVIP: {
                title: "ULTRAVIP Özel Menüsü",
                badgeText: "ULTRAVIP",
                badgeColor: "linear-gradient(135deg, #c084fc, #9333ea)", // Mor tonları
                cardBorder: "#a855f7",
                glowColor: "rgba(168, 85, 247, 0.2)",
                titleColor: "#d8b4fe",
                priceText: "200.00 ₺ / 30 Gün",
                btnText: "200.00 ₺ Öde ve Rütbeyi Al",
                features: [
                    "Tüm <strong>VIP</strong> ve <strong>MEGAVIP</strong> yetkileri dahildir",
                    "<strong>[ULTRAVIP]</strong> Özel mor sohbet başlığı ve rengi",
                    "<strong>UltraVIP Kiti</strong> ile üst düzey büyülü setler",
                    "Fazladan 3 adet <strong>Sethome</strong> hakkı",
                    "Işınlanma bekleme süresi <strong>Tamamen Sıfır</strong> (Anında TPA)"
                ]
            }
        };

        // Hangi VIP gösterilecekse buraya adını yazman yeterli: 'VIP', 'MEGAVIP' veya 'ULTRAVIP'
        const currentVip = 'ULTRAVIP'; 

        function applyVipConfig(vipKey) {
            const config = vipConfigs[vipKey];
            if (!config) return;

            document.getElementById('bar-title').innerText = config.title;
            document.getElementById('vip-badge').innerText = config.badgeText;
            document.getElementById('vip-badge').style.background = config.badgeColor;
            
            const card = document.getElementById('vip-card');
            card.style.borderColor = config.cardBorder;
            card.style.boxShadow = `0 0 20px ${config.glowColor}`;

            document.getElementById('vip-name').innerText = `${config.badgeText} Paket Ayrıcalıkları`;
            document.getElementById('vip-name').style.color = config.titleColor;
            document.getElementById('vip-price').innerText = config.priceText;
            document.getElementById('pay-btn-text').innerText = config.btnText;

            const featuresUl = document.getElementById('vip-features');
            featuresUl.innerHTML = config.features.map(f => `<li>${f}</li>`).join('');

            // Giriş yapmış kullanıcının adını otomatik getir
            const savedUser = localStorage.getItem('kunefeUser');
            if (savedUser) {
                document.getElementById('username').value = savedUser;
            }
        }

        // Sayfa yüklendiğinde seçili konfigürasyonu uygula
        applyVipConfig(currentVip);
    </script>
</body>
</html>
