<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KünefeSMP | Cezalar</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d0401;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px 60px 20px;
        }

        /* ARKA PLAN DOKUSU */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, #3d1708 0%, #1c0a03 60%, #0d0401 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(202, 138, 4, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(202, 138, 4, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
        }

        /* ÜST MENÜ */
        header {
            width: 100%;
            max-width: 1200px;
            margin: 40px auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(35, 17, 8, 0.85);
            border: 2px solid #ca8a04;
            border-radius: 18px;
            padding: 15px 25px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .logo-box {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #fef08a 0%, #facc15 100%);
            color: #422006;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
        }

        .logo-box:hover { transform: scale(1.05); }

        nav ul {
            display: flex;
            gap: 15px;
            list-style: none;
        }

        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 10px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav ul li a.active, nav ul li a:hover {
            background: #facc15;
            color: #422006;
        }

        .user-btn {
            width: 50px;
            height: 50px;
            border: 2px solid #ca8a04;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #facc15;
            background: rgba(202, 138, 4, 0.2);
            text-decoration: none;
        }

        /* CEZA LİSTESİ KART KUTUSU */
        .penalty-card {
            width: 100%;
            max-width: 1000px;
            background: rgba(28, 10, 3, 0.9);
            border: 2px solid #ca8a04;
            border-radius: 20px;
            padding: 35px 30px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            margin-top: 10px;
        }

        .title {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            color: #facc15;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* TABLO YAPISI */
        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        thead tr {
            background: rgba(61, 23, 8, 0.8);
        }

        th {
            color: #facc15;
            font-size: 14px;
            font-weight: 800;
            text-align: left;
            padding: 14px 18px;
            border-bottom: 2px solid #ca8a04;
        }

        th:first-child { border-top-left-radius: 10px; }
        th:last-child { border-top-right-radius: 10px; }

        tbody tr {
            transition: background 0.2s ease;
            border-bottom: 1px solid rgba(202, 138, 4, 0.15);
        }

        tbody tr:hover {
            background: rgba(202, 138, 4, 0.08);
        }

        td {
            padding: 16px 18px;
            font-size: 14px;
            font-weight: 700;
            color: #e5e7eb;
            border-bottom: 1px solid rgba(202, 138, 4, 0.15);
        }

        /* ROZET (CEZA TÜRÜ) STİLİ */
        .badge-ban {
            background: #ef4444;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 900;
            display: inline-block;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
        }

        .badge-mute {
            background: #f59e0b;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 900;
            display: inline-block;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
        }

        .badge-kick {
            background: #3b82f6;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 900;
            display: inline-block;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        /* BOŞ KALAN / VERİ OLMAYAN DURUM */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
            font-weight: 700;
            font-size: 15px;
        }

        /* BOŞ SPAN/ROZETLERİN ÇİZGİ ŞEKLİNDE GÖRÜNMESİNİ ENGELLER */
        span:empty {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ÜST MENÜ -->
    <header>
        <a href="index.html" class="logo-box">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
        </a>

        <nav>
            <ul>
                <li><a href="index.html">ANASAYFA</a></li>
                <li><a href="magaza.html">MAĞAZA</a></li>
                <li><a href="yardim.html">YARDIM</a></li>
                <li><a href="destek.html">DESTEK</a></li>
                <li><a href="cezalar.html" class="active">CEZALAR</a></li>
            </ul>
        </nav>

        <a href="giris.html" class="user-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </a>
    </header>

    <!-- CEZA KART KUTUSU -->
    <div class="penalty-card">
        <h1 class="title">Sunucu Ceza Listesi</h1>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Oyuncu</th>
                        <th>Ceza Türü</th>
                        <th>Sebep</th>
                        <th>Yetkili</th>
                        <th>Süre</th>
                    </tr>
                </thead>
                <tbody id="penalty-list-body">
                    <!-- Dinamik olarak JS ile dolacak -->
                </tbody>
            </table>
            <div id="no-penalty-msg" class="empty-state" style="display: none;">
                Henüz sistemde aktif bir ceza kaydı bulunmamaktadır.
            </div>
        </div>
    </div>

    <script>
        // CEZA VERİLERİ (Gelecekte Firebase'den veya API'den çekebilirsin)
        // Eğer dizi boşsa [] tablo temiz görünecektir.
        const penalties = [
            {
                player: "xWemmbux",
                type: "BAN", // BAN, MUTE veya KICK
                reason: "Yetkiliye Saygısızlık",
                staff: "UnplugMC",
                duration: "Süresiz"
            }
            /* Yeni cezalar geldikçe buraya eklenir. Veri eklenmediği sürece boş satır görünmez. */
        ];

        function renderPenalties() {
            const tbody = document.getElementById('penalty-list-body');
            const noPenaltyMsg = document.getElementById('no-penalty-msg');

            tbody.innerHTML = '';

            if (penalties.length === 0) {
                noPenaltyMsg.style.display = 'block';
                return;
            }

            noPenaltyMsg.style.display = 'none';

            penalties.forEach(item => {
                const tr = document.createElement('tr');

                // Ceza Türü Rozet Rengi
                let badgeClass = 'badge-ban';
                if (item.type.toUpperCase() === 'MUTE') badgeClass = 'badge-mute';
                if (item.type.toUpperCase() === 'KICK') badgeClass = 'badge-kick';

                tr.innerHTML = `
                    <td>${item.player}</td>
                    <td><span class="${badgeClass}">${item.type}</span></td>
                    <td>${item.reason}</td>
                    <td>${item.staff}</td>
                    <td>${item.duration}</td>
                `;

                tbody.appendChild(tr);
            });
        }

        // Sayfa yüklendiğinde çalıştır
        renderPenalties();
    </script>
</body>
</html>
