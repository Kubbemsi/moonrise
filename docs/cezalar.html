<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KünefeSMP | Sunucu Ceza Listesi</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d0401;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- ARKA PLAN --- */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: radial-gradient(circle at center, #3d1708 0%, #1c0a03 60%, #0d0401 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px 60px 20px;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(202, 138, 4, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(202, 138, 4, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* --- ÜST MENÜ --- */
        header {
            width: 100%;
            max-width: 1300px;
            margin: 40px auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(35, 17, 8, 0.85);
            border: 2px solid #ca8a04;
            border-radius: 18px;
            padding: 15px 25px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .logo-box {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #fef08a 0%, #facc15 100%);
            color: #422006;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
        }

        .logo-box:hover { transform: scale(1.05); }

        nav ul {
            display: flex;
            gap: 15px;
            list-style: none;
        }

        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 10px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav ul li a.active, nav ul li a:hover {
            background: #facc15;
            color: #422006;
        }

        nav ul li a.active svg, nav ul li a:hover svg { fill: #422006; }

        .user-btn {
            width: 50px;
            height: 50px;
            border: 2px solid #ca8a04;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #facc15;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .user-btn:hover { background: rgba(202, 138, 4, 0.2); }

        /* --- İÇERİK KONTEYNERİ --- */
        .container {
            width: 100%;
            max-width: 1100px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-top: 10px;
        }

        .page-card {
            background: rgba(35, 17, 8, 0.85);
            border: 2px solid #ca8a04;
            border-radius: 20px;
            padding: 35px 30px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .page-title {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* --- CEZA TABLOSU --- */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
        }

        th {
            background: rgba(202, 138, 4, 0.2);
            color: #facc15;
            font-weight: 900;
            font-size: 14px;
            padding: 16px 20px;
            border-bottom: 2px solid #ca8a04;
        }

        th:first-child { border-top-left-radius: 10px; }
        th:last-child { border-top-right-radius: 10px; }

        td {
            padding: 16px 20px;
            font-size: 14px;
            font-weight: 700;
            color: #e5e7eb;
            border-bottom: 1px solid rgba(202, 138, 4, 0.2);
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* --- CEZA ROLLERİ VE ROZETLERİ --- */
        .badge-ban {
            background: #ef4444;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 900;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .badge-mute {
            background: #f59e0b;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 900;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .badge-kick {
            background: #3b82f6;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 900;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .loading-text {
            text-align: center;
            color: #fef08a;
            padding: 20px;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <!-- ÜST MENÜ -->
        <header>
            <a href="index.html" class="logo-box">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
            </a>

            <nav>
                <ul>
                    <li><a href="index.html">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                        ANASAYFA
                    </a></li>
                    <li><a href="magaza.html">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                        MAĞAZA
                    </a></li>
                    <li><a href="yardim.html">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
                        YARDIM
                    </a></li>
                    <li><a href="destek.html">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1c-4.97 0-9 4.03-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h3c1.66 0 3-1.34 3-3v-7c0-4.97-4.03-9-9-9z"/></svg>
                        DESTEK
                    </a></li>
                    <li><a href="cezalar.html" class="active">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8 0-1.85.63-3.55 1.69-4.9L16.9 18.31C15.55 19.37 13.85 20 12 20zm5.31-3.1L6.1 5.69C7.45 4.63 9.15 4 12 4c4.42 0 8 3.58 8 8 0 1.85-.63 3.55-1.69 4.9z"/></svg>
                        CEZALAR
                    </a></li>
                </ul>
            </nav>

            <a href="giris.html" class="user-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </a>
        </header>

        <!-- İÇERİK ALANI -->
        <div class="container">
            <div class="page-card">
                <h1 class="page-title">SUNUCU CEZA LİSTESİ</h1>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Oyuncu</th>
                                <th>Ceza Türü</th>
                                <th>Sebep</th>
                                <th>Yetkili</th>
                                <th>Süre</th>
                            </tr>
                        </thead>
                        <tbody id="ceza-listesi">
                            <tr>
                                <td colspan="5" class="loading-text">Ceza listesi yükleniyor...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- CEZALAR.JSON ENTEGRASYONU -->
    <script>
        async function fetchCezalar() {
            const tableBody = document.getElementById("ceza-listesi");
            
            try {
                const response = await fetch("cezalar.json");
                if (!response.ok) throw new Error("JSON yüklenemedi");
                
                const cezalar = await response.json();
                renderTable(cezalar);
            } catch (error) {
                console.warn("cezalar.json okunamadı, varsayılan veri gösteriliyor:", error);
                
                // cezalar.json erişilemezse veya yerel dosyada çalışıyorsa gösterilecek yedek liste
                const varsayilanCezalar = [
                    {
                        oyuncu: "xXemmbux",
                        tur: "BAN",
                        sebep: "Yetkiliye Saygısızlık",
                        yetkili: "UnplugMC",
                        sure: "Süresiz"
                    }
                ];
                renderTable(varsayilanCezalar);
            }
        }

        function renderTable(data) {
            const tableBody = document.getElementById("ceza-listesi");
            tableBody.innerHTML = "";

            if (!data || data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Aktif ceza kaydı bulunamadı.</td></tr>`;
                return;
            }

            data.forEach(item => {
                let badgeClass = "badge-ban";
                const turLower = (item.tur || "").toLowerCase();
                
                if (turLower.includes("mute")) badgeClass = "badge-mute";
                else if (turLower.includes("kick")) badgeClass = "badge-kick";

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${item.oyuncu}</td>
                    <td><span class="${badgeClass}">${item.tur}</span></td>
                    <td>${item.sebep}</td>
                    <td>${item.yetkili}</td>
                    <td>${item.sure}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // Sayfa açıldığında verileri yükle
        fetchCezalar();
    </script>
</body>
</html>
