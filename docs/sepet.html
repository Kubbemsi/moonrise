<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KünefeSMP | Alışveriş Sepetim</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0a0402;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.15) 0%, transparent 70%);
            z-index: -2;
            filter: blur(60px);
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(234, 179, 8, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(234, 179, 8, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        .top-nav {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 10, 5, 0.85);
            border: 1px solid rgba(234, 179, 8, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 12px 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .btn-back { color: #eab308; text-decoration: none; font-weight: 800; font-size: 13px; }
        .nav-title { color: #fef08a; font-size: 16px; font-weight: 900; letter-spacing: 1px; }

        .cart-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1.8fr 1.2fr;
            gap: 25px;
        }

        .cart-box, .summary-box {
            background: rgba(18, 10, 5, 0.85);
            border: 1px solid rgba(234, 179, 8, 0.3);
            border-radius: 18px;
            padding: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .box-title {
            font-size: 16px;
            font-weight: 900;
            color: #eab308;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(234, 179, 8, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-clear-all {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(234, 179, 8, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .item-info h4 { font-size: 15px; font-weight: 800; color: #fff; }
        .item-info p { font-size: 12px; color: #a1a1aa; margin-top: 4px; }
        .item-info p span { color: #eab308; font-weight: 800; }

        .item-price {
            font-size: 15px;
            font-weight: 900;
            color: #22c55e;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-remove {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-remove:hover { background: #ef4444; color: #fff; }

        .summary-box { display: flex; flex-direction: column; justify-content: space-between; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 13px; color: #a1a1aa; }
        .summary-row.total {
            border-top: 1px solid rgba(234, 179, 8, 0.2);
            padding-top: 15px; margin-top: 15px; font-size: 16px; font-weight: 900; color: #fff;
        }
        .summary-row.total span { color: #22c55e; }

        .papara-info {
            background: rgba(234, 179, 8, 0.08);
            border: 1px dashed #eab308;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin: 20px 0;
        }

        .papara-info div { font-size: 10px; color: #a1a1aa; font-weight: 800; }
        .papara-info h5 { font-size: 20px; color: #facc15; font-weight: 900; letter-spacing: 1px; margin: 4px 0; }
        .papara-info p { font-size: 10px; color: #d1d5db; }

        .btn-checkout {
            width: 100%;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
        }

        .empty-cart-msg { text-align: center; padding: 40px 0; color: #71717a; font-size: 14px; }

        @media (max-width: 800px) { .cart-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="magaza.html" class="btn-back">← Mağazaya Dön</a>
        <div class="nav-title">Alışveriş Sepetim</div>
        <div style="width: 80px;"></div>
    </div>

    <div class="cart-container">
        <div class="cart-box">
            <div class="box-title">
                <span>SEPETTEKİ ÜRÜNLER</span>
                <button class="btn-clear-all" onclick="clearCart()" id="clearAllBtn" style="display:none;">Sepeti Temizle</button>
            </div>
            <div id="cartContent"></div>
        </div>

        <div class="summary-box">
            <div>
                <div class="box-title">SİPARİŞ ÖZETİ</div>
                <div class="summary-row">
                    <span>Ara Toplam</span>
                    <span id="subTotal">0.00 ₺</span>
                </div>
                <div class="summary-row total">
                    <span>Toplam Tutar</span>
                    <span id="grandTotal">0.00 ₺</span>
                </div>

                <div class="papara-info" id="paparaSection" style="display: none;">
                    <div>PAPARA HESAP NUMARAMIZ</div>
                    <h5>1588226875</h5>
                    <p>*Ödemeyi yaparken açıklama kısmına <u>Oyuncu Adını</u> yazmayı unutma!</p>
                </div>
            </div>

            <button class="btn-checkout" id="checkoutBtn" onclick="confirmOrder()" style="display: none;">
                SİPARİŞİ TAMAMLA
            </button>
        </div>
    </div>

    <script>
        function loadCart() {
            const rawData = localStorage.getItem('kunefeCart');
            const cartContent = document.getElementById('cartContent');
            const subTotal = document.getElementById('subTotal');
            const grandTotal = document.getElementById('grandTotal');
            const paparaSection = document.getElementById('paparaSection');
            const checkoutBtn = document.getElementById('checkoutBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');

            let cart = rawData ? JSON.parse(rawData) : [];

            // Eğer eski sistemden kalma tek nesne varsa listeye çevir
            if (cart && !Array.isArray(cart)) {
                cart = [cart];
                localStorage.setItem('kunefeCart', JSON.stringify(cart));
            }

            if (!cart || cart.length === 0) {
                cartContent.innerHTML = `<div class="empty-cart-msg">Sepetinizde ürün bulunmuyor.</div>`;
                subTotal.innerText = "0.00 ₺";
                grandTotal.innerText = "0.00 ₺";
                paparaSection.style.display = "none";
                checkoutBtn.style.display = "none";
                clearAllBtn.style.display = "none";
                return;
            }

            let html = "";
            let total = 0;

            cart.forEach((item, index) => {
                total += item.totalPrice;
                html += `
                    <div class="cart-item">
                        <div class="item-info">
                            <h4>${item.quantity}x ${item.name}</h4>
                            <p>Oyuncu Adı: <span>${item.username}</span></p>
                            <p style="font-size:11px; color:#71717a;">Birim Fiyat: ${item.unitPrice.toFixed(2)} ₺</p>
                        </div>
                        <div class="item-price">
                            ${item.totalPrice.toFixed(2)} ₺
                            <button class="btn-remove" onclick="removeItem(${index})">X</button>
                        </div>
                    </div>
                `;
            });

            cartContent.innerHTML = html;
            subTotal.innerText = total.toFixed(2) + " ₺";
            grandTotal.innerText = total.toFixed(2) + " ₺";
            paparaSection.style.display = "block";
            checkoutBtn.style.display = "block";
            clearAllBtn.style.display = "inline-block";
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('kunefeCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('kunefeCart', JSON.stringify(cart));
            loadCart();
        }

        function clearCart() {
            localStorage.removeItem('kunefeCart');
            loadCart();
        }

        function confirmOrder() {
            let cart = JSON.parse(localStorage.getItem('kunefeCart')) || [];
            if (cart.length === 0) return;

            alert("Tebrikler! Toplam " + cart.length + " kalem ürün siparişiniz alındı. Papara ödemeniz kontrol edilip aktarılacaktır.");
            clearCart();
        }

        loadCart();
    </script>
</body>
</html>
