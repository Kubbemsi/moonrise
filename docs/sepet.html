<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KünefeSMP | Sepetim</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d0401;
            background-image: 
                linear-gradient(rgba(202, 138, 4, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(202, 138, 4, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 30px;
            padding-bottom: 30px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1050px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 0 15px;
        }

        /* --- ÜST BAR --- */
        .top-bar {
            width: 100%;
            background: rgba(25, 10, 2, 0.9);
            border: 1.5px solid #855302;
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .back-btn {
            background: transparent;
            color: #facc15;
            border: none;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }

        .back-btn:hover { color: #ffffff; }

        .top-title {
            font-size: 15px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- İÇERİK IZGARASI --- */
        .cart-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
        }

        @media (max-width: 850px) {
            .cart-grid { grid-template-columns: 1fr; }
        }

        /* --- SOL TARAF: ÜRÜN LİSTESİ --- */
        .cart-items-card {
            background: rgba(20, 8, 2, 0.85);
            border: 1px solid #523202;
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cart-item {
            background: rgba(10, 4, 1, 0.6);
            border: 1px solid rgba(202, 138, 4, 0.2);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-title {
            font-size: 16px;
            font-weight: 900;
            color: #ffffff;
        }

        .item-price {
            font-size: 13px;
            font-weight: 800;
            color: #22c55e;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Adet Sayacı */
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid #422502;
        }

        .qty-btn {
            background: rgba(202, 138, 4, 0.2);
            border: 1px solid #ca8a04;
            color: #facc15;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .qty-btn:hover {
            background: #ca8a04;
            color: #0d0401;
        }

        .qty-input {
            width: 30px;
            text-align: center;
            font-size: 14px;
            font-weight: 900;
            color: #ffffff;
            background: transparent;
            border: none;
            outline: none;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
            font-size: 12px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #ef4444;
            color: #ffffff;
        }

        .empty-cart {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
            font-size: 15px;
            font-weight: 800;
        }

        /* --- SAĞ TARAF: ÖZET VE TOPLAM TUTAR --- */
        .summary-card {
            background: rgba(20, 8, 2, 0.85);
            border: 1px solid #523202;
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: fit-content;
        }

        .summary-title {
            font-size: 16px;
            font-weight: 900;
            color: #facc15;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(202, 138, 4, 0.2);
            padding-bottom: 10px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
            font-weight: 800;
            color: #d1d5db;
        }

        .summary-row.total {
            font-size: 18px;
            color: #ffffff;
            border-top: 1px dashed rgba(202, 138, 4, 0.3);
            padding-top: 15px;
            margin-top: 5px;
        }

        .summary-row.total .total-amount {
            color: #22c55e;
            font-size: 22px;
            font-weight: 900;
        }

        .user-box {
            background: rgba(10, 4, 1, 0.8);
            border: 1px solid #422502;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
        }

        .user-box svg {
            fill: #a855f7;
            width: 16px;
            height: 16px;
        }

        .checkout-btn {
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: #ffffff;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
            transition: transform 0.2s, filter 0.2s;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- ÜST BAR -->
        <div class="top-bar">
            <a href="magaza.html" class="back-btn">← Mağazaya Dön</a>
            <div class="top-title">SEPETİM</div>
            <div></div> <!-- Dengeleme için boş div -->
        </div>

        <!-- İÇERİK IZGARASI -->
        <div class="cart-grid">
            <!-- SOL: SEPETTEKİ ÜRÜNLER -->
            <div class="cart-items-card" id="cart-items-container">
                <!-- JavaScript burayı dolduracak -->
            </div>

            <!-- SAĞ: ÖZET VE TOPLAM YAZISI -->
            <div class="summary-card">
                <div class="summary-title">SIPARIŞ ÖZETI</div>

                <div>
                    <div style="font-size: 11px; font-weight: 800; color: #facc15; margin-bottom: 6px;">GİRİŞ YAPILAN HESAP</div>
                    <div class="user-box">
                        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        <span id="logged-username">asd</span>
                    </div>
                </div>

                <div class="summary-row">
                    <span>Toplam Adet:</span>
                    <span id="total-count">0 Adet</span>
                </div>

                <div class="summary-row total">
                    <span>Toplam Tutar:</span>
                    <span class="total-amount" id="total-price">0.00 ₺</span>
                </div>

                <button class="checkout-btn" onclick="proceedToCheckout()">ÖDEMEYE GEÇ</button>
            </div>
        </div>
    </div>

    <script>
        let cart = [];

        document.addEventListener('DOMContentLoaded', () => {
            // Kullanıcı adını yükle
            const savedUser = localStorage.getItem('kunefeUser');
            if (savedUser) {
                document.getElementById('logged-username').innerText = savedUser;
            }

            // Sepeti yükle ve çiz
            loadCart();
        });

        function loadCart() {
            try {
                cart = JSON.parse(localStorage.getItem('kunefeCart')) || [];
            } catch (e) {
                cart = [];
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        🛒 Sepetiniz şu anda boş.<br><br>
                        <a href="magaza.html" style="color: #facc15; text-decoration: underline;">Mağazaya dönüp ürün ekleyebilirsiniz.</a>
                    </div>
                `;
                document.getElementById('total-count').innerText = "0 Adet";
                document.getElementById('total-price').innerText = "0.00 ₺";
                return;
            }

            let html = '';
            let totalAmount = 0;
            let totalCount = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                totalAmount += itemTotal;
                totalCount += item.quantity;

                html += `
                    <div class="cart-item">
                        <div class="item-info">
                            <div class="item-title">${item.title}</div>
                            <div class="item-price">${itemTotal.toFixed(2)} ₺ (${item.price} ₺ / adet)</div>
                        </div>

                        <div class="item-actions">
                            <div class="quantity-control">
                                <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                                <input type="text" class="qty-input" value="${item.quantity}" readonly>
                                <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                            </div>
                            <button class="delete-btn" onclick="removeItem(${index})">Sil</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('total-count').innerText = `${totalCount} Adet`;
            document.getElementById('total-price').innerText = `${totalAmount.toFixed(2)} ₺`;
        }

        function changeQty(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity < 1) {
                cart[index].quantity = 1;
            }
            saveAndRefresh();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            saveAndRefresh();
        }

        function saveAndRefresh() {
            localStorage.setItem('kunefeCart', JSON.stringify(cart));
            renderCart();
        }

        function proceedToCheckout() {
            if (cart.length === 0) {
                alert("Sepetiniz boş!");
                return;
            }
            alert("Ödeme sayfasına yönlendiriliyorsunuz...");
            // Buraya ödeme sayfanızın adını koyabilirsiniz:
            // window.location.href = "odeme.html";
        }
    </script>
</body>
</html>
