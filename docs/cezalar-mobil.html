<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KünefeSMP | Cezalar (Mobil)</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

    <!-- PC KULLANICISI GELİRSE PC SİTESİNE GERİ YÖNLENDİR -->
    <script>
        if (window.innerWidth > 768 && !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            window.location.href = "cezalar.html";
        }
    </script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Montserrat',sans-serif; user-select:none; }
        body { background-color:#0d0401; color:#ffffff; min-height:100vh; }

        .mobile-container {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: radial-gradient(circle at center, #3d1708 0%, #1c0a03 60%, #0d0401 100%);
            min-height: 100vh;
        }

        /* --- MOBİL HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(35, 17, 8, 0.9);
            border: 2px solid #ca8a04;
            border-radius: 14px;
            padding: 12px 16px;
            position: relative;
            z-index: 20;
        }

        .logo-box {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #fef08a 0%, #facc15 100%);
            color: #422006;
            border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            text-decoration: none;
        }

        .menu-toggle { background:transparent; border:none; color:#facc15; cursor:pointer; }

        nav {
            display: none;
            position: absolute;
            top: 70px; left: 0; right: 0;
            background: rgba(25, 10, 4, 0.98);
            border: 2px solid #ca8a04;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        nav.open { display: block; }
        nav ul { list-style:none; display:flex; flex-direction:column; gap:10px; }
        nav ul li a {
            color: #ffffff; text-decoration:none; font-weight:800; font-size:15px;
            padding: 12px; border-radius:8px; display:flex; align-items:center; gap:12px;
            background: rgba(255,255,255,0.05);
        }
        nav ul li a.active { background:#facc15; color:#422006; }

        /* --- BAŞLIK --- */
        .page-header { text-align:center; margin-top:5px; }
        .page-header h1 { font-size:26px; font-weight:900; color:#facc15; text-shadow:0 0 15px rgba(250,204,21,0.3); }
        .page-header p { font-size:11px; font-weight:800; color:#fef08a; margin-top:4px; opacity:0.9; }

        /* --- CEZA KARTLARI --- */
        .penalty-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .penalty-card {
            background: rgba(35, 17, 8, 0.85);
            border: 2px solid #ca8a04;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .penalty-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-cell {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 900;
            color: #ffffff;
        }

        .player-head {
            width: 28px; height: 28px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .badge-ban  { background:#ef4444; color:#fff; padding:4px 10px; border-radius:6px; font-size:11px; font-weight:900; text-transform:uppercase; }
        .badge-mute { background:#f59e0b; color:#fff; padding:4px 10px; border-radius:6px; font-size:11px; font-weight:900; text-transform:uppercase; }
        .badge-kick { background:#3b82f6; color:#fff; padding:4px 10px; border-radius:6px; font-size:11px; font-weight:900; text-transform:uppercase; }

        .penalty-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .detail-label {
            font-size: 9px;
            font-weight: 900;
            color: #facc15;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .detail-value {
            font-size: 12px;
            font-weight: 700;
            color: #e5e7eb;
            line-height: 1.3;
        }

        .sebep-row {
            border-top: 1px solid rgba(202,138,4,0.2);
            padding-top: 8px;
        }

        /* --- BOŞ DURUM --- */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #9ca3af;
            font-weight: 700;
            font-size: 13px;
            background: rgba(35,17,8,0.85);
            border: 2px solid #ca8a04;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="mobile-container">

        <!-- HEADER -->
        <header>
            <a href="mobile.html" class="logo-box">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
            </a>
            <button class="menu-toggle" onclick="toggleMenu()">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <nav id="mobileNav">
                <ul>
                    <li><a href="mobile.html">ANASAYFA</a></li>
                    <li><a href="magaza-mobile.html">MAĞAZA</a></li>
                    <li><a href="yardim-mobile.html">YARDIM</a></li>
                    <li><a href="destek-mobile.html">DESTEK</a></li>
                    <li><a href="cezalar-mobil.html" class="active">CEZALAR</a></li>
                </ul>
            </nav>
        </header>

        <!-- BAŞLIK -->
        <div class="page-header">
            <h1>CEZA LİSTESİ</h1>
            <p>Sunucudaki aktif ceza kayıtları</p>
        </div>

        <!-- CEZA KARTLARI -->
        <div class="penalty-list" id="penalty-list"></div>
        <div class="empty-state" id="no-penalty-msg" style="display:none;">
            Henüz sistemde aktif bir ceza kaydı bulunmamaktadır.
        </div>

    </div>

    <script>
        function toggleMenu() {
            document.getElementById('mobileNav').classList.toggle('open');
        }

        async function fetchAndRenderPenalties() {
            const list = document.getElementById('penalty-list');
            const noPenaltyMsg = document.getElementById('no-penalty-msg');

            try {
                const response = await fetch('cezalar.json');
                if (!response.ok) throw new Error('JSON okunamadı');

                const rawData = await response.json();
                const activePenalties = rawData.filter(item => item.oyuncu && item.oyuncu.trim() !== "");

                if (activePenalties.length === 0) {
                    noPenaltyMsg.style.display = 'block';
                    return;
                }

                activePenalties.forEach(item => {
                    const turUpper = (item.tur || '').toUpperCase();
                    let badgeClass = 'badge-ban';
                    if (turUpper === 'MUTE') badgeClass = 'badge-mute';
                    if (turUpper === 'KICK') badgeClass = 'badge-kick';

                    const card = document.createElement('div');
                    card.className = 'penalty-card';
                    card.innerHTML = `
                        <div class="penalty-top">
                            <div class="player-cell">
                                <img src="https://mc-heads.net/avatar/${item.oyuncu}/28" class="player-head" alt="${item.oyuncu}" onerror="this.src='https://mc-heads.net/avatar/Steve/28'">
                                ${item.oyuncu}
                            </div>
                            <span class="${badgeClass}">${item.tur}</span>
                        </div>
                        <div class="penalty-details">
                            <div class="detail-item">
                                <span class="detail-label">YETKİLİ</span>
                                <span class="detail-value">${item.yetkili}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">SÜRE</span>
                                <span class="detail-value">${item.sure}</span>
                            </div>
                        </div>
                        <div class="detail-item sebep-row">
                            <span class="detail-label">SEBEP</span>
                            <span class="detail-value">${item.sebep}</span>
                        </div>
                    `;
                    list.appendChild(card);
                });

            } catch (error) {
                noPenaltyMsg.style.display = 'block';
                noPenaltyMsg.innerText = "Cezalar yüklenirken bir hata oluştu veya 'cezalar.json' dosyası bulunamadı.";
            }
        }

        fetchAndRenderPenalties();
    </script>
</body>
</html>
