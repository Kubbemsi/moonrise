<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KünefeSMP | Minecraft Sunucusu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* --- ARKA PLAN (Mor Degrade) --- */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #6b21a8 0%, #3b0764 60%, #090a0f 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.2) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 0, 0, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* --- ÜST MENÜ (NAVBAR) --- */
        header {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1400px;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-box {
            background: #facc15;
            color: #000;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 4px 0 #ca8a04;
            cursor: pointer;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 15px;
            background: rgba(0, 0, 0, 0.35);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
        }

        nav ul li a {
            color: #e2e8f0;
            text-decoration: none;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
            text-transform: uppercase;
        }

        nav ul li a:hover {
            color: #facc15;
        }

        .user-btn {
            background: #facc15;
            color: #000;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: 0 4px 0 #ca8a04;
            cursor: pointer;
            text-decoration: none;
        }

        /* --- ORTA İÇERİK --- */
        .main-content {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            margin-bottom: 40px;
        }

        /* SOL: IP KOPYALAMA BUTONU */
        .ip-card {
            background: linear-gradient(180deg, #fef08a 0%, #facc15 100%);
            border: 4px solid #fef08a;
            border-radius: 18px;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            box-shadow: 0 8px 0 #ca8a04, 0 15px 25px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
        }

        .ip-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #ca8a04, 0 20px 30px rgba(0,0,0,0.6);
        }

        .ip-card:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #ca8a04;
        }

        .ip-icon {
            background: rgba(0, 0, 0, 0.15);
            color: #713f12;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        .ip-details {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .ip-title {
            color: #422006;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .ip-status {
            color: #713f12;
            font-size: 12px;
            font-weight: 700;
        }

        /* SAĞ: DISCORD BUTONU */
        .discord-card {
            background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
            border: 4px solid #818cf8;
            border-radius: 18px;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 8px 0 #3730a3, 0 15px 25px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
        }

        .discord-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #3730a3, 0 20px 30px rgba(0,0,0,0.6);
        }

        .discord-card:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #3730a3;
        }

        .discord-icon {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .discord-details {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .discord-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 900;
        }

        .discord-sub {
            color: #c7d2fe;
            font-size: 12px;
            font-weight: 700;
        }

        /* ORTA: MASKOT VE ZEMİN SİYAH TEPE */
        .mascot-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .mascot-img {
            max-height: 320px;
            object-fit: contain;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
            z-index: 2;
        }

        .bottom-hill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: #090a0f;
            border-top-left-radius: 50% 30px;
            border-top-right-radius: 50% 30px;
            z-index: 1;
        }

        /* Toast Bildirimi */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #facc15;
            color: #000;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 800;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <header>
            <div class="logo-box">
                <i class="fa-solid fa-crown"></i>
            </div>

            <nav>
                <ul>
                    <li><a href="index.html"><i class="fa-solid fa-house"></i> ANASAYFA</a></li>
                    <li><a href="https://discord.gg/Mj6QMcNQ2" target="_blank"><i class="fa-solid fa-coins"></i> KREDİ SATIN AL</a></li>
                    <li><a href="https://discord.gg/Mj6QMcNQ2" target="_blank"><i class="fa-solid fa-cart-shopping"></i> MAĞAZA</a></li>
                    <li><a href="https://discord.gg/Mj6QMcNQ2" target="_blank"><i class="fa-solid fa-pen-to-square"></i> YETKİLİ BAŞVURULARI</a></li>
                    <li><a href="https://discord.gg/Mj6QMcNQ2" target="_blank"><i class="fa-solid fa-circle-question"></i> YARDIM</a></li>
                    <li><a href="https://discord.gg/Mj6QMcNQ2" target="_blank"><i class="fa-solid fa-headset"></i> DESTEK</a></li>
                    <li><a href="https://discord.gg/Mj6QMcNQ2" target="_blank"><i class="fa-solid fa-ban"></i> CEZALAR</a></li>
                </ul>
            </nav>

            <a href="https://discord.gg/Mj6QMcNQ2" target="_blank" class="user-btn">
                <i class="fa-solid fa-user"></i>
            </a>
        </header>

        <div class="main-content">
            <div class="ip-card" onclick="copyIp()">
                <div class="ip-icon">
                    <i class="fa-solid fa-play"></i>
                </div>
                <div class="ip-details">
                    <span class="ip-title">OYNA.KUNEFESMP.COM.TR</span>
                    <span class="ip-status" id="playerCount">Yükleniyor...</span>
                </div>
            </div>

            <div class="mascot-container">
                <img src="https://api.mineatar.io/body/full/MHF_Steve?scale=10" alt="Mascot" class="mascot-img">
            </div>

            <a href="https://discord.gg/Mj6QMcNQ2" target="_blank" class="discord-card">
                <div class="discord-icon">
                    <i class="fa-brands fa-discord"></i>
                </div>
                <div class="discord-details">
                    <span class="discord-title">DISCORD</span>
                    <span class="discord-sub">Topluluğumuza katıl.</span>
                </div>
            </a>
        </div>

        <div class="bottom-hill"></div>
    </div>

    <div id="toast" class="toast">IP adresi panoya kopyalandı!</div>

    <script>
        function copyIp() {
            const ip = "oyna.kunefesmp.com.tr";
            navigator.clipboard.writeText(ip);
            
            const toast = document.getElementById("toast");
            toast.style.display = "block";
            
            setTimeout(() => {
                toast.style.display = "none";
            }, 2500);
        }

        async function fetchServerStatus() {
            const serverIp = "oyna.kunefesmp.com.tr";
            const playerCount = document.getElementById("playerCount");

            try {
                const response = await fetch(`https://api.mcsrvstat.us/2/${serverIp}`);
                const data = await response.json();

                if (data.online) {
                    playerCount.innerText = `${data.players.online} oyuncu aktif.`;
                } else {
                    playerCount.innerText = `Sunucu Çevrimdışı.`;
                }
            } catch (error) {
                playerCount.innerText = `IP'yi kopyalamak için tıkla!`;
            }
        }

        fetchServerStatus();
    </script>
</body>
</html>
