<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KünefeSMP | Minecraft Sunucusu</title>
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d0401;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- ARKA PLAN --- */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: radial-gradient(circle at center, #3d1708 0%, #1c0a03 60%, #0d0401 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 40px;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(202, 138, 4, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(202, 138, 4, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* --- ÜST MENÜ --- */
        header {
    max-width: 1300px;
    margin: 0 auto 30px auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(35, 17, 8, 0.85);
    border: 2px solid #ca8a04;
    border-radius: 18px;
    padding: 15px 25px;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}

.logo-box {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, #fef08a 0%, #facc15 100%);
    color: #422006;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
}

nav ul {
    display: flex;
    list-style: none;
    gap: 20px;
    margin: 0;
    padding: 0;
}

nav ul li a {
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 10px;
    transition: all 0.2s;
}

nav ul li a:hover, nav ul li a.active {
    background: #facc15;
    color: #422006;
}

.user-btn {
    width: 45px;
    height: 45px;
    border: 2px solid #ca8a04;
    border-radius: 12px;
    color: #facc15;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    font-size: 18px;
    transition: all 0.2s;
}

.user-btn:hover {
    background: #ca8a04;
    color: #fff;
}

        /* --- ORTA HERO İÇERİK --- */
        .center-content {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: 40px 0;
        }

        .server-title {
            font-size: 48px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 4px 15px rgba(250, 204, 21, 0.4), 0 0 30px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .server-subtitle {
            font-size: 16px;
            color: #fde047;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* YouTube Kanal Kartı */
        .yt-card {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.9) 0%, rgba(153, 27, 27, 0.9) 100%);
            border: 2px solid #ef4444;
            border-radius: 16px;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: #fff;
            text-decoration: none;
            box-shadow: 0 8px 0 #7f1d1d, 0 10px 25px rgba(220, 38, 38, 0.3);
            transition: all 0.2s ease;
        }

        .yt-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 0 #7f1d1d, 0 15px 30px rgba(220, 38, 38, 0.5);
        }

        .yt-icon {
            font-size: 32px;
            color: #fff;
        }

        .yt-details {
            text-align: left;
        }

        .yt-name {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .yt-sub {
            font-size: 12px;
            color: #fca5a5;
            font-weight: 700;
        }

        /* --- ALT KISIM (KARTLAR VE KARAKTER) --- */
        .main-content {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
        }

        /* SOL IP BUTONU */
        .ip-card {
            background: linear-gradient(180deg, #fef08a 0%, #facc15 100%);
            border: 4px solid #fef08a;
            border-radius: 18px;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            box-shadow: 0 8px 0 #b45309, 0 15px 25px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
        }

        .ip-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #b45309, 0 20px 30px rgba(0,0,0,0.6);
        }

        .ip-card:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b45309;
        }

        .ip-icon {
            background: rgba(0, 0, 0, 0.15);
            color: #422006;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        .ip-details {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .ip-title {
            color: #422006;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .ip-status {
            color: #713f12;
            font-size: 12px;
            font-weight: 700;
        }

        /* SAĞ DISCORD BUTONU */
        .discord-card {
            background: linear-gradient(180deg, #22c55e 0%, #166534 100%);
            border: 4px solid #4ade80;
            border-radius: 18px;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 8px 0 #14532d, 0 15px 25px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
        }

        .discord-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #14532d, 0 20px 30px rgba(0,0,0,0.6);
        }

        .discord-card:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #14532d;
        }

        .discord-icon {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .discord-details {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .discord-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 900;
        }

        .discord-sub {
            color: #dcfce7;
            font-size: 12px;
            font-weight: 700;
        }

        /* ORTA ROZET İKONU */
        .mascot-box {
            background: rgba(35, 17, 8, 0.9);
            border: 3px solid #ca8a04;
            width: 90px;
            height: 90px;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            color: #facc15;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        /* Toast Bildirimi */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #facc15;
            color: #422006;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 800;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <!-- ÜST MENÜ -->
        <header>
    <a href="index.html" class="logo-box">
        <i class="fa-solid fa-crown"></i>
    </a>

    <nav>
        <ul>
            <li><a href="index.html" class="active"><i class="fa-solid fa-house"></i> ANASAYFA</a></li>
            <li><a href="magaza.html" class="active"><i class="fa-solid fa-cart-shopping"></i> MAĞAZA</a></li>
            <li><a href="yardim.html" class="active"><i class="fa-solid fa-circle-question"></i> YARDIM</a></li>
            <li><a href="destek.html" class="active"><i class="fa-solid fa-headset"></i> DESTEK</a></li>
            <li><a href="https://discord.gg/Mj6QMcNQ2" target="_blank"><i class="fa-solid fa-ban"></i> CEZALAR</a></li>
        </ul>
    </nav>

    <a href="https://discord.gg/Mj6QMcNQ2" target="_blank" class="user-btn">
        <i class="fa-solid fa-user"></i>
    </a>
</header>

        <!-- ORTA HERO ALANI -->
        <div class="center-content">
            <h1 class="server-title">KÜNEFESMP</h1>
            <p class="server-subtitle">BİLDİĞİN DÜMDÜZ SMP SUNUCUSU İŞTE</p>

            <!-- YOUTUBE KANALI -->
            <a href="https://www.youtube.com/@UnplugMC" target="_blank" class="yt-card">
                <i class="fa-brands fa-youtube yt-icon"></i>
                <div class="yt-details">
                    <div class="yt-name">UnplugMC YouTube</div>
                    <div class="yt-sub">Videoları ve yayınları kaçırma!</div>
                </div>
            </a>
        </div>

        <!-- ALT KISIM -->
        <div class="main-content">
            <!-- SOL IP BUTONU -->
            <div class="ip-card" onclick="copyIp()">
                <div class="ip-icon">
                    <i class="fa-solid fa-play"></i>
                </div>
                <div class="ip-details">
                    <span class="ip-title">OYNA.KUNEFESMP.COM.TR</span>
                    <span class="ip-status" id="playerCount">Yükleniyor...</span>
                </div>
            </div>

            <!-- ORTA İKON -->
            <div class="mascot-box">
                <i class="fa-solid fa-gamepad"></i>
            </div>

            <!-- SAĞ DISCORD BUTONU -->
            <a href="https://discord.gg/Mj6QMcNQ2" target="_blank" class="discord-card">
                <div class="discord-icon">
                    <i class="fa-brands fa-discord"></i>
                </div>
                <div class="discord-details">
                    <span class="discord-title">DISCORD</span>
                    <span class="discord-sub">Topluluğumuza katıl.</span>
                </div>
            </a>
        </div>
    </div>

    <!-- KOPYALANDI BİLDİRİMİ -->
    <div id="toast" class="toast">IP adresi panoya kopyalandı!</div>

    <script>
        function copyIp() {
            const ip = "oyna.kunefesmp.com.tr";
            navigator.clipboard.writeText(ip);
            
            const toast = document.getElementById("toast");
            toast.style.display = "block";
            
            setTimeout(() => {
                toast.style.display = "none";
            }, 2500);
        }

        async function fetchServerStatus() {
            const serverIp = "oyna.kunefesmp.com.tr";
            const playerCount = document.getElementById("playerCount");

            try {
                const response = await fetch(`https://api.mcsrvstat.us/2/${serverIp}`);
                const data = await response.json();

                if (data.online) {
                    playerCount.innerText = `${data.players.online} oyuncu aktif.`;
                } else {
                    playerCount.innerText = `Sunucu Çevrimdışı.`;
                }
            } catch (error) {
                playerCount.innerText = `IP'yi kopyalamak için tıkla!`;
            }
        }

        fetchServerStatus();
    </script>
</body>
</html>
