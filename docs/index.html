<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KünefeSMP | Minecraft Sunucusu</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d0401;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- ARKA PLAN --- */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: radial-gradient(circle at center, #3d1708 0%, #1c0a03 60%, #0d0401 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 40px 20px;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(202, 138, 4, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(202, 138, 4, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* --- ÜST MENÜ --- */
        header {
            width: 100%;
            max-width: 1300px;
            margin: 40px auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(35, 17, 8, 0.85);
            border: 2px solid #ca8a04;
            border-radius: 18px;
            padding: 15px 25px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .logo-box {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #fef08a 0%, #facc15 100%);
            color: #422006;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
        }

        .logo-box:hover {
            transform: scale(1.05);
        }

        nav ul {
            display: flex;
            gap: 15px;
            list-style: none;
        }

        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 10px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav ul li a.active, nav ul li a:hover {
            background: #facc15;
            color: #422006;
        }

        nav ul li a.active svg, nav ul li a:hover svg {
            fill: #422006;
        }

        .user-btn {
            width: 50px;
            height: 50px;
            border: 2px solid #ca8a04;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #facc15;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .user-btn:hover {
            background: rgba(202, 138, 4, 0.2);
        }

        /* --- ORTA İÇERİK --- */
        .main-content {
            text-align: center;
            z-index: 10;
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .server-title {
            font-size: 56px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 25px rgba(250, 204, 21, 0.4);
            letter-spacing: 2px;
        }

        .server-subtitle {
            font-size: 16px;
            font-weight: 800;
            color: #fef08a;
            letter-spacing: 1px;
            margin-top: 8px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .youtube-btn {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            border: 2px solid #ef4444;
            padding: 14px 32px;
            border-radius: 14px;
            color: #ffffff;
            text-decoration: none;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.4);
            transition: transform 0.2s ease;
        }

        .youtube-btn:hover {
            transform: translateY(-3px);
        }

        .youtube-btn .title {
            font-size: 18px;
            font-weight: 900;
        }

        .youtube-btn .sub {
            font-size: 11px;
            opacity: 0.8;
            font-weight: 700;
        }

        /* --- ALT KARTLAR --- */
        .bottom-cards {
            width: 100%;
            max-width: 1300px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            gap: 20px;
        }

        .card-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 25px;
            border-radius: 18px;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease;
            min-width: 320px;
        }

        .card-btn:hover {
            transform: translateY(-3px);
        }

        .ip-card {
            background: linear-gradient(135deg, #fef08a 0%, #facc15 100%);
            color: #422006;
            box-shadow: 0 10px 20px rgba(250, 204, 21, 0.2);
        }

        .discord-card {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.2);
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ip-card .card-icon {
            background: rgba(66, 32, 6, 0.15);
        }

        .discord-card .card-icon {
            background: rgba(0, 0, 0, 0.15);
        }

        .card-text {
            display: flex;
            flex-direction: column;
        }

        .card-text .main-text {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .card-text .sub-text {
            font-size: 11px;
            font-weight: 700;
            opacity: 0.8;
        }

        .mascot-box {
            background: rgba(35, 17, 8, 0.9);
            border: 3px solid #ca8a04;
            width: 90px;
            height: 90px;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        /* TOAST BİLDİRİMİ */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #facc15;
            color: #422006;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 800;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <!-- ÜST MENÜ -->
        <header>
            <a href="index.html" class="logo-box">
                <!-- Taç İkonu -->
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
            </a>

            <nav>
                <ul>
                    <li><a href="index.html" class="active">
                        <!-- Ev İkonu -->
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                        ANASAYFA
                    </a></li>
                    <li><a href="magaza.html">
                        <!-- Sepet İkonu -->
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                        MAĞAZA
                    </a></li>
                    <li><a href="yardim.html">
                        <!-- Soru İşareti İkonu -->
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
                        YARDIM
                    </a></li>
                    <li><a href="destek.html">
                        <!-- Kulaklık İkonu -->
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1c-4.97 0-9 4.03-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h3c1.66 0 3-1.34 3-3v-7c0-4.97-4.03-9-9-9z"/></svg>
                        DESTEK
                    </a></li>
                    <li><a href="cezalar.html">
                        <!-- Yasak İkonu -->
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8 0-1.85.63-3.55 1.69-4.9L16.9 18.31C15.55 19.37 13.85 20 12 20zm5.31-3.1L6.1 5.69C7.45 4.63 9.15 4 12 4c4.42 0 8 3.58 8 8 0 1.85-.63 3.55-1.69 4.9z"/></svg>
                        CEZALAR
                    </a></li>
                </ul>
            </nav>

            <a href="giris.html" class="user-btn">
                <!-- Profil İkonu -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </a>
        </header>

        <!-- ORTA BAŞLIK VE BUTON -->
        <main class="main-content">
            <h1 class="server-title">KÜNEFESMP</h1>
            <p class="server-subtitle">BİLDİĞİN DÜMDÜZ SMP SUNUCUSU İŞTE</p>
            
            <a href="https://youtube.com/@unplugmc" target="_blank" class="youtube-btn">
                <span class="title">UnplugMC YouTube</span>
                <span class="sub">Videoları ve yayınları kaçırma!</span>
            </a>
        </main>

        <!-- ALT KARTLAR -->
        <div class="bottom-cards">
            <!-- IP KOPYALAMA KARTI -->
            <div class="card-btn ip-card" onclick="copyIP('oyna.kunefesmp.com.tr')">
                <div class="card-icon">
                    <!-- Kopyala İkonu -->
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                </div>
                <div class="card-text">
                    <span class="main-text">OYNA.KUNEFESMP.COM.TR</span>
                    <span class="sub-text">0 oyuncu aktif.</span>
                </div>
            </div>

            <!-- ORTA ROZET -->
            <div class="mascot-box">
                <!-- Sunucu Rozeti İkonu -->
                <svg width="48" height="48" viewBox="0 0 24 24" fill="#facc15"><path d="M12 2L1 21h22L12 2zm0 3.83L19.13 19H4.87L12 5.83zM11 16h2v2h-2zm0-6h2v4h-2z"/></svg>
            </div>

            <!-- DISCORD KARTI -->
            <a href="https://discord.gg/Mj6QMcNQ2" target="_blank" class="card-btn discord-card">
                <div class="card-icon">
                    <!-- Discord İkonu -->
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                </div>
                <div class="card-text">
                    <span class="main-text">DISCORD</span>
                    <span class="sub-text">Topluluğumuza katıl.</span>
                </div>
            </a>
        </div>
    </div>

    <div id="toast" class="toast">IP Adresi Kopyalandı!</div>

    <script>
        function copyIP(ip) {
            navigator.clipboard.writeText(ip).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 2000);
            });
        }
    </script>
</body>
</html>
